<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="CSS/Style.css">
</head>
<body>
    <p class="title">Rock Paper Scissor</p>

    <button class="move-button js-rock-button">
    <img src="img/Rock-emoji.png" alt="Rock" class="move-icon">

    </button>

    <button class="move-button js-paper-button">
    <img src="img/Paper-emoji.png" alt="Paper" class="move-icon">
    
    </button>

    <button class="move-button js-scissor-button">
    <img src="img/Scissor-emoji.png" alt="Scissor" class="move-icon">
    
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button onclick="
    score.Wins = 0;
    score.Losses = 0;
    score.Ties = 0;
    localStorage.setItem('score', JSON.stringify(score));
    updateScoreElement();
    " class="reset-score-button">Reset Score</button>

    <button class="auto-play-button" onclick="
    autoplay();
    ">Auto Play</button>
        
<script src="JavaScript/script.js"></script>

</body>
</html>
